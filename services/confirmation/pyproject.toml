[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veilwatch-confirmation"
version = "0.1.0"
description = "Multi-signal threat scoring, auto-confirm gating, operator review queue."
requires-python = ">=3.11"
dependencies = [
  "veilwatch-contracts",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic-settings>=2.2,<3",
  "redis>=5.0,<6",
  "uvloop>=0.19; sys_platform != 'win32'",
  # Postgres persistence (Phase 3 Slice 2). Optional at runtime — confirmation
  # falls back to in-memory if POSTGRES_HOST is unset (see alert_store.py).
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",  # required by fastapi.testclient for WebSocket tests
  "aiosqlite>=0.19,<1",  # in-process async SQLite for persistence tests
]

[tool.setuptools.packages.find]
where = ["src"]
