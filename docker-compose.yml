version: "3.9"

# VeilWatch Phase 1 POC — local dev stack.
# Kafka runs in KRaft mode (no ZooKeeper). Single-broker, NOT for production.

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  FRAME_STORE_BACKEND: ${FRAME_STORE_BACKEND:-local}
  FRAME_STORE_LOCAL_PATH: /var/veilwatch/frames

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: veilwatch-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: veilwatch-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4
    container_name: veilwatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veilwatch}
      POSTGRES_USER: ${POSTGRES_USER:-veilwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_secrets_manager}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veilwatch}"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: veilwatch-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-veilwatch}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  capture:
    build:
      context: .
      dockerfile: services/capture/Dockerfile
    container_name: veilwatch-capture
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      <<: *common-env
      CAPTURE_CAMERA_ID: ${CAPTURE_CAMERA_ID:-CAM-01}
      CAPTURE_CAMERA_LAT: ${CAPTURE_CAMERA_LAT:-0.0}
      CAPTURE_CAMERA_LON: ${CAPTURE_CAMERA_LON:-0.0}
      RTSP_URL: ${RTSP_URL}
      CAPTURE_TARGET_FPS: ${CAPTURE_TARGET_FPS:-5}
      CAPTURE_JPEG_QUALITY: ${CAPTURE_JPEG_QUALITY:-85}
    volumes:
      - framestore:/var/veilwatch/frames

  detection:
    build:
      context: .
      dockerfile: services/detection/Dockerfile
    container_name: veilwatch-detection
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      <<: *common-env
      YOLO_WEIGHTS: ${YOLO_WEIGHTS:-yolov8n.pt}
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      YOLO_CONF_THRESHOLD: ${YOLO_CONF_THRESHOLD:-0.35}
      WATCHLIST_SEED_PATH: /etc/veilwatch/watchlist_seed.json
      WATCHLIST_MATCH_THRESHOLD: ${WATCHLIST_MATCH_THRESHOLD:-0.62}
      ALPR_BACKEND: ${ALPR_BACKEND:-mock}
      ALPR_MIN_CONFIDENCE: ${ALPR_MIN_CONFIDENCE:-0.55}
      REID_BACKEND: ${REID_BACKEND:-mock}
      REID_ONNX_MODEL_PATH: ${REID_ONNX_MODEL_PATH:-/etc/veilwatch/osnet.onnx}
    volumes:
      - framestore:/var/veilwatch/frames:ro
      - ./services/detection/watchlist_seed.json:/etc/veilwatch/watchlist_seed.json:ro

  tracker:
    build:
      context: .
      dockerfile: services/tracker/Dockerfile
    container_name: veilwatch-tracker
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      <<: *common-env
      TRACKER_MATCH_THRESHOLD: ${TRACKER_MATCH_THRESHOLD:-0.72}
      TRACKER_RECENCY_SECONDS: ${TRACKER_RECENCY_SECONDS:-300}
      TRACKER_MAX_IDENTITIES: ${TRACKER_MAX_IDENTITIES:-10000}
      TRACKER_CENTROID_ALPHA: ${TRACKER_CENTROID_ALPHA:-0.2}

  confirmation:
    build:
      context: .
      dockerfile: services/confirmation/Dockerfile
    container_name: veilwatch-confirmation
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-veilwatch}
      POSTGRES_USER: ${POSTGRES_USER:-veilwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_secrets_manager}
      CONFIRMATION_AUTOCONFIRM_THRESHOLD: ${CONFIRMATION_AUTOCONFIRM_THRESHOLD:-0.85}
      CONFIRMATION_OPERATOR_REVIEW_THRESHOLD: ${CONFIRMATION_OPERATOR_REVIEW_THRESHOLD:-0.55}
      CONFIRMATION_TRACK_WINDOW_SECONDS: ${CONFIRMATION_TRACK_WINDOW_SECONDS:-30}
      CONFIRMATION_HTTP_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
  framestore:
